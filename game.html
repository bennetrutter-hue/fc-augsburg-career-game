<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCA PRO — Mert Kömür 3D Career Mode</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materials/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050b12;
            color: #edf5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .split-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .game-section {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .editor-section {
            width: 450px;
            background: linear-gradient(145deg, #0a1420, #050b12);
            border-left: 2px solid #263f54;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .editor-section::-webkit-scrollbar {
            width: 8px;
        }

        .editor-section::-webkit-scrollbar-track {
            background: #050b12;
        }

        .editor-section::-webkit-scrollbar-thumb {
            background: #355067;
            border-radius: 4px;
        }

        .editor-section::-webkit-scrollbar-thumb:hover {
            background: #d5ae5b;
        }

        .header {
            background: linear-gradient(120deg, #1a2f3f, #0d1b29);
            border: 2px solid #d5ae5b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 900;
            color: #d5ae5b;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            color: #9fb1c3;
        }

        .control-panel {
            background: #08131f;
            border: 1px solid #263f54;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .control-panel h3 {
            font-size: 14px;
            color: #d5ae5b;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            font-size: 11px;
            color: #9fb1c3;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #2a4359;
            background: #07131f;
            color: white;
            font-size: 12px;
        }

        .control-group input:focus,
        .control-group select:focus {
            border-color: #d5ae5b;
            outline: none;
        }

        .rotation-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .rotation-btn {
            padding: 10px;
            border: 1px solid #355067;
            background: #112335;
            color: #d5ae5b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
        }

        .rotation-btn:hover {
            background: #1a3d52;
            border-color: #d5ae5b;
        }

        .pose-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .pose-btn {
            padding: 8px;
            border: 1px solid #355067;
            background: #112335;
            color: #d5ae5b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: all 0.2s;
        }

        .pose-btn:hover {
            background: #1a3d52;
            border-color: #d5ae5b;
        }

        .color-picker {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .color-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.05);
        }

        .color-option.active {
            border-color: #d5ae5b;
            box-shadow: 0 0 10px #d5ae5b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-card {
            background: #0c1926;
            border: 1px solid #22394c;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 10px;
            color: #9fb1c3;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 20px;
            font-weight: bold;
            color: #d5ae5b;
        }

        .stat-bar {
            height: 4px;
            background: #152a3d;
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d5ae5b, #f0d976);
            transition: width 0.3s;
        }

        .btn-primary {
            width: 100%;
            background: #d5ae5b;
            color: #111;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-primary:hover {
            background: #e8c97d;
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .cutscene {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 11, 18, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
            animation: fadeIn 0.5s ease-out;
        }

        .cutscene.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .cutscene-content {
            text-align: center;
            max-width: 800px;
        }

        .cutscene-title {
            font-size: 28px;
            font-weight: 900;
            color: #d5ae5b;
            margin-bottom: 10px;
        }

        .cutscene-text {
            font-size: 16px;
            color: #9fb1c3;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .cutscene-button {
            background: #d5ae5b;
            color: #111;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .cutscene-button:hover {
            background: #e8c97d;
            transform: translateY(-2px);
        }

        .match-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(8, 19, 31, 0.9);
            border: 2px solid #d5ae5b;
            border-radius: 12px;
            padding: 15px 20px;
            pointer-events: auto;
            display: none;
            z-index: 20;
        }

        .match-hud.active {
            display: block;
        }

        .match-hud h2 {
            font-size: 24px;
            font-weight: 900;
            color: #d5ae5b;
        }

        .match-hud p {
            font-size: 12px;
            color: #9fb1c3;
            margin-top: 5px;
        }

        .action-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(213, 174, 91, 0.9);
            color: #111;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 900;
            text-align: center;
            pointer-events: none;
            animation: pulse 1s infinite;
            display: none;
        }

        .action-indicator.active {
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 1200px) {
            .editor-section {
                width: 350px;
            }
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
            }

            .editor-section {
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 2px solid #263f54;
            }

            .game-section {
                height: 60%;
            }
        }
    </style>
</head>
<body>
    <div class="split-layout">
        <div class="game-section">
            <canvas id="gameCanvas"></canvas>
            <div class="match-hud" id="matchHUD">
                <h2 id="scoreboard">FCA 0 : 0 OPP</h2>
                <p id="matchTime">00:00 / 90:00</p>
            </div>
            <div class="action-indicator" id="actionIndicator">
                SPACE = Schuss | E = Pass | WASD = Bewegen
            </div>
        </div>

        <div class="editor-section" id="editorSection">
            <div class="header">
                <h1>⚙️ SPIELER EDITOR</h1>
                <p id="phaseText">Locker Room - Passe dich an</p>
            </div>

            <div class="control-panel">
                <h3>👀 Avatar Kontrolle</h3>
                <div class="rotation-controls">
                    <button class="rotation-btn" onclick="rotatePlayer(-Math.PI/6)">◀ Links</button>
                    <button class="rotation-btn" onclick="rotatePlayer(0)">🔄 Front</button>
                    <button class="rotation-btn" onclick="rotatePlayer(Math.PI/6)">Rechts ▶</button>
                </div>
                <div class="pose-buttons">
                    <button class="pose-btn" onclick="setPlayerPose('idle')">😐 Stehen</button>
                    <button class="pose-btn" onclick="setPlayerPose('celebration')">🎉 Jubel</button>
                    <button class="pose-btn" onclick="setPlayerPose('warmup')">🔥 Aufwärmen</button>
                    <button class="pose-btn" onclick="setPlayerPose('pass')">🤝 Pass</button>
                </div>
            </div>

            <div class="control-panel">
                <h3>👟 Schuhe</h3>
                <div class="control-group">
                    <label>Modell</label>
                    <select id="shoeModel" onchange="updatePlayerModel()">
                        <option value="adidas-speed">Adidas Speed</option>
                        <option value="adidas-predator">Adidas Predator</option>
                        <option value="nike-vapor">Nike Vapor</option>
                        <option value="nike-phantom">Nike Phantom</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Schuh Farbe</label>
                    <div class="color-picker">
                        <div class="color-option active" onclick="setShoeColor('black')" style="background: #1a1a1a;"></div>
                        <div class="color-option" onclick="setShoeColor('white')" style="background: #f5f5f5; border: 1px solid #ccc;"></div>
                        <div class="color-option" onclick="setShoeColor('gold')" style="background: #d4af37;"></div>
                        <div class="color-option" onclick="setShoeColor('red')" style="background: #c41e3a;"></div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <h3>👕 Ausrüstung</h3>
                <div class="control-group">
                    <label>Trikot</label>
                    <select id="jerseyType" onchange="updateJersey()">
                        <option value="home">Heimtrikot (Weiß)</option>
                        <option value="away">Auswärtstrikot (Blau)</option>
                        <option value="prematch">Prematch (Schwarz)</option>
                        <option value="training">Training (Weinrot)</option>
                    </select>
                </div>
            </div>

            <div class="control-panel">
                <h3>📊 Spieler Stats</h3>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">Fitness</div>
                        <div class="value" id="fitnessStat">84</div>
                        <div class="stat-bar"><div class="stat-bar-fill" style="width: 84%;"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Form</div>
                        <div class="value" id="formStat">78</div>
                        <div class="stat-bar"><div class="stat-bar-fill" style="width: 78%;"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Taktik</div>
                        <div class="value" id="tacticStat">72</div>
                        <div class="stat-bar"><div class="stat-bar-fill" style="width: 72%;"></div></div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Chemie</div>
                        <div class="value" id="chemStat">70</div>
                        <div class="stat-bar"><div class="stat-bar-fill" style="width: 70%;"></div></div>
                    </div>
                </div>
            </div>

            <button class="btn-primary" onclick="proceedToNextPhase()">WEITER ZUR NÄCHSTEN STATION →</button>
        </div>
    </div>

    <div class="cutscene" id="cutscene">
        <div class="cutscene-content">
            <div class="cutscene-title" id="cutsceneTitle">🎬 Ankunft</div>
            <div class="cutscene-text" id="cutsceneText">Du kommst im Trainingszentrum an...</div>
            <button class="cutscene-button" onclick="skipCutscene()">Weiter →</button>
        </div>
    </div>

    <script>
        const gameState = {
            phase: 'lockerroom',
            playerRotation: 0,
            playerPose: 'idle',
            currentShoes: 'adidas-speed',
            currentShoeColor: 'black',
            currentJersey: 'home',
            fitness: 84,
            form: 78,
            tactics: 72,
            chemistry: 70,
            goals: 0,
            assists: 0,
            matchTime: 0,
            matchDuration: 90,
            isPlaying: false,
            keys: {}
        };

        let scene, camera, engine, canvas;
        let playerGroup, playerHead, playerBody, playerJersey, playerLeftShoe, playerRightShoe;
        let matchAnimationId;

        // Initialize Babylon.js
        async function initScene() {
            canvas = document.getElementById('gameCanvas');
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.02, 0.04, 0.07);

            // Camera
            camera = new BABYLON.ArcRotateCamera('camera', Math.PI / 2.5, Math.PI / 2.2, 2.5, new BABYLON.Vector3(0, 0.5, 0), scene);
            camera.attachControl(canvas, true);
            camera.inertia = 0.7;
            camera.angularSensibilityX = 1000;
            camera.angularSensibilityY = 1000;
            camera.minZ = 0.1;
            camera.maxZ = 1000;

            // Lights - Professional lighting setup
            const ambientLight = new BABYLON.HemisphericLight('ambientLight', new BABYLON.Vector3(1, 1, 1), scene);
            ambientLight.intensity = 0.9;

            const keyLight = new BABYLON.PointLight('keyLight', new BABYLON.Vector3(5, 5, 5), scene);
            keyLight.intensity = 0.8;
            keyLight.range = 50;

            const fillLight = new BABYLON.PointLight('fillLight', new BABYLON.Vector3(-5, 3, -5), scene);
            fillLight.intensity = 0.4;
            fillLight.range = 40;

            const spotLight = new BABYLON.SpotLight('spotLight', new BABYLON.Vector3(0, 8, 0), new BABYLON.Vector3(0, -1, 0), Math.PI / 3, 2, scene);
            spotLight.intensity = 1;
            spotLight.range = 60;

            // Create environments
            createLockerRoom();
            createPitchEnvironment();

            // Create detailed player
            createDetailedPlayer();

            // Input handling
            document.addEventListener('keydown', (e) => {
                gameState.keys[e.key] = true;
                if (gameState.phase === 'match' && gameState.isPlaying) {
                    if (e.key === ' ') shootBall();
                    if (e.key === 'e' || e.key === 'E') passBall();
                }
            });

            document.addEventListener('keyup', (e) => {
                gameState.keys[e.key] = false;
            });

            // Main render loop
            engine.runRenderLoop(() => {
                scene.render();
                updateGameLoop();
            });

            window.addEventListener('resize', () => engine.resize());

            showCutscene('Ankunft', 'Du kommst mit deinem FCA-Rucksack im Trainingszentrum an.\n\nBereite dich vor, bearbeite deine Ausrüstung und knüpfe dich zusammen für den großen Match!');
        }

        function createDetailedPlayer() {
            playerGroup = new BABYLON.TransformNode('playerGroup', scene);
            playerGroup.position = new BABYLON.Vector3(0, 0, 0);

            // KOPF (Head with detailed features)
            playerHead = BABYLON.MeshBuilder.CreateSphere('playerHead', { diameter: 0.35, segments: 64 }, scene);
            playerHead.position = new BABYLON.Vector3(0, 1.5, 0);
            playerHead.parent = playerGroup;

            const headMaterial = new BABYLON.StandardMaterial('headMat', scene);
            headMaterial.diffuse = new BABYLON.Color3(0.95, 0.82, 0.72); // Helle gebräunte Hautfarbe
            headMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            headMaterial.specularPower = 16;
            playerHead.material = headMaterial;

            // HAARE (Schwarzer Buzzcut)
            const hairSphere = BABYLON.MeshBuilder.CreateSphere('hair', { diameter: 0.38, segments: 64 }, scene);
            hairSphere.position = new BABYLON.Vector3(0, 1.52, 0);
            hairSphere.parent = playerGroup;

            const hairMaterial = new BABYLON.StandardMaterial('hairMat', scene);
            hairMaterial.diffuse = new BABYLON.Color3(0.08, 0.08, 0.08);
            hairMaterial.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            hairSphere.material = hairMaterial;

            // AUGEN (Eyes)
            const leftEye = BABYLON.MeshBuilder.CreateSphere('leftEye', { diameter: 0.08, segments: 32 }, scene);
            leftEye.position = new BABYLON.Vector3(-0.08, 1.55, 0.15);
            leftEye.parent = playerGroup;

            const eyeMaterial = new BABYLON.StandardMaterial('eyeMat', scene);
            eyeMaterial.diffuse = new BABYLON.Color3(0.2, 0.2, 0.2);
            eyeMaterial.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            leftEye.material = eyeMaterial;

            const rightEye = BABYLON.MeshBuilder.CreateSphere('rightEye', { diameter: 0.08, segments: 32 }, scene);
            rightEye.position = new BABYLON.Vector3(0.08, 1.55, 0.15);
            rightEye.parent = playerGroup;
            rightEye.material = eyeMaterial;

            // RUMPF (Body/Torso)
            playerBody = BABYLON.MeshBuilder.CreateBox('playerBody', { width: 0.35, height: 0.65, depth: 0.25 }, scene);
            playerBody.position = new BABYLON.Vector3(0, 0.8, 0);
            playerBody.parent = playerGroup;

            const bodyMaterial = new BABYLON.StandardMaterial('bodyMat', scene);
            bodyMaterial.diffuse = new BABYLON.Color3(0.95, 0.82, 0.72);
            bodyMaterial.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
            playerBody.material = bodyMaterial;

            // TRIKOT (Jersey - Heimtrikot weiß)
            playerJersey = BABYLON.MeshBuilder.CreateBox('playerJersey', { width: 0.37, height: 0.67, depth: 0.27 }, scene);
            playerJersey.position = new BABYLON.Vector3(0, 0.8, 0.01);
            playerJersey.parent = playerGroup;

            const jerseyMaterial = new BABYLON.StandardMaterial('jerseyMat', scene);
            jerseyMaterial.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            jerseyMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            jerseyMaterial.specularPower = 32;
            playerJersey.material = jerseyMaterial;

            // RÜCKENNUMMER (Jersey Number - 10)
            const numberTexture = BABYLON.DynamicTexture.CreateFromBase64String('numberTexture', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', scene);
            const numberMaterial = new BABYLON.StandardMaterial('numberMat', scene);
            numberMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);

            // ARME (Arms)
            const leftArm = BABYLON.MeshBuilder.CreateBox('leftArm', { width: 0.18, height: 0.6, depth: 0.18 }, scene);
            leftArm.position = new BABYLON.Vector3(-0.28, 0.8, 0);
            leftArm.parent = playerGroup;
            leftArm.material = bodyMaterial;

            const rightArm = BABYLON.MeshBuilder.CreateBox('rightArm', { width: 0.18, height: 0.6, depth: 0.18 }, scene);
            rightArm.position = new BABYLON.Vector3(0.28, 0.8, 0);
            rightArm.parent = playerGroup;
            rightArm.material = bodyMaterial;

            // HANDGELENK TAPE (Wristape - Weiß)
            const wristTape = BABYLON.MeshBuilder.CreateBox('wristTape', { width: 0.2, height: 0.08, depth: 0.2 }, scene);
            wristTape.position = new BABYLON.Vector3(-0.28, 0.5, 0);
            wristTape.parent = playerGroup;

            const wristTapeMat = new BABYLON.StandardMaterial('wristTapeMat', scene);
            wristTapeMat.diffuse = new BABYLON.Color3(1, 1, 1);
            wristTapeMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            wristTape.material = wristTapeMat;

            // HOSE (Pants - Weinrot)
            const pants = BABYLON.MeshBuilder.CreateBox('pants', { width: 0.35, height: 0.45, depth: 0.25 }, scene);
            pants.position = new BABYLON.Vector3(0, 0.25, 0);
            pants.parent = playerGroup;

            const pantsMaterial = new BABYLON.StandardMaterial('pantsMat', scene);
            pantsMaterial.diffuse = new BABYLON.Color3(0.55, 0.12, 0.12);
            pantsMaterial.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
            pants.material = pantsMaterial;

            // STUTZEN (Socks - Weiß)
            const socks = BABYLON.MeshBuilder.CreateBox('socks', { width: 0.33, height: 0.12, depth: 0.23 }, scene);
            socks.position = new BABYLON.Vector3(0, -0.1, 0);
            socks.parent = playerGroup;

            const socksMaterial = new BABYLON.StandardMaterial('socksMat', scene);
            socksMaterial.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            socks.material = socksMaterial;

            // SCHUHE (Shoes - Schwarz)
            playerLeftShoe = BABYLON.MeshBuilder.CreateBox('leftShoe', { width: 0.18, height: 0.12, depth: 0.28 }, scene);
            playerLeftShoe.position = new BABYLON.Vector3(-0.1, -0.25, 0);
            playerLeftShoe.parent = playerGroup;

            const shoeMaterial = new BABYLON.StandardMaterial('shoeMat', scene);
            shoeMaterial.diffuse = new BABYLON.Color3(0.1, 0.1, 0.1);
            shoeMaterial.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            playerLeftShoe.material = shoeMaterial;

            playerRightShoe = BABYLON.MeshBuilder.CreateBox('rightShoe', { width: 0.18, height: 0.12, depth: 0.28 }, scene);
            playerRightShoe.position = new BABYLON.Vector3(0.1, -0.25, 0);
            playerRightShoe.parent = playerGroup;
            playerRightShoe.material = shoeMaterial;
        }

        function createLockerRoom() {
            const ground = BABYLON.MeshBuilder.CreateGround('ground', { width: 30, height: 30 }, scene);
            const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
            groundMat.diffuse = new BABYLON.Color3(0.08, 0.1, 0.15);
            ground.material = groundMat;

            // Benches
            for (let i = 0; i < 3; i++) {
                const locker = BABYLON.MeshBuilder.CreateBox('locker' + i, { width: 1.5, height: 2.5, depth: 0.8 }, scene);
                locker.position = new BABYLON.Vector3(-5 + i * 3, 1.25, -10);
                const lockerMat = new BABYLON.StandardMaterial('lockerMat' + i, scene);
                lockerMat.diffuse = new BABYLON.Color3(0.35, 0.35, 0.35);
                locker.material = lockerMat;
            }
        }

        function createPitchEnvironment() {
            const pitch = BABYLON.MeshBuilder.CreateGround('pitch', { width: 120, height: 80 }, scene);
            const pitchMat = new BABYLON.StandardMaterial('pitchMat', scene);
            pitchMat.diffuse = new BABYLON.Color3(0.1, 0.4, 0.15);
            pitch.material = pitchMat;
        }

        function rotatePlayer(angle) {
            if (angle === 0) {
                gameState.playerRotation = 0;
            } else {
                gameState.playerRotation = angle;
            }
            playerGroup.rotation.y = gameState.playerRotation;
        }

        function setPlayerPose(pose) {
            gameState.playerPose = pose;
            switch (pose) {
                case 'celebration':
                    playerGroup.getChildMeshes()[3].rotation.z = Math.PI / 4;
                    playerGroup.getChildMeshes()[4].rotation.z = -Math.PI / 4;
                    break;
                case 'warmup':
                    playerGroup.getChildMeshes()[3].rotation.x = Math.PI / 6;
                    playerGroup.getChildMeshes()[4].rotation.x = -Math.PI / 6;
                    break;
                case 'pass':
                    playerGroup.getChildMeshes()[3].rotation.z = Math.PI / 3;
                    break;
                default:
                    playerGroup.getChildMeshes().forEach(m => m.rotation = new BABYLON.Vector3(0, 0, 0));
            }
        }

        function setShoeColor(color) {
            gameState.currentShoeColor = color;
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            let colorVec;
            switch (color) {
                case 'white': colorVec = new BABYLON.Color3(0.95, 0.95, 0.95); break;
                case 'gold': colorVec = new BABYLON.Color3(0.83, 0.69, 0.22); break;
                case 'red': colorVec = new BABYLON.Color3(0.77, 0.12, 0.23); break;
                default: colorVec = new BABYLON.Color3(0.1, 0.1, 0.1);
            }
            playerLeftShoe.material.diffuse = colorVec;
            playerRightShoe.material.diffuse = colorVec;
        }

        function updateJersey() {
            const jerseyType = document.getElementById('jerseyType').value;
            gameState.currentJersey = jerseyType;

            let color;
            switch (jerseyType) {
                case 'away': color = new BABYLON.Color3(0.09, 0.54, 0.61); break; // Blau
                case 'prematch': color = new BABYLON.Color3(0.1, 0.1, 0.1); break; // Schwarz
                case 'training': color = new BABYLON.Color3(0.55, 0.12, 0.12); break; // Weinrot
                default: color = new BABYLON.Color3(1, 0.95, 0.85); // Weiß
            }
            playerJersey.material.diffuse = color;
        }

        function updatePlayerModel() {
            gameState.currentShoes = document.getElementById('shoeModel').value;
        }

        function proceedToNextPhase() {
            if (gameState.phase === 'lockerroom') {
                gameState.phase = 'warmup';
                document.getElementById('phaseText').textContent = 'Aufwärmen - Bereite dich auf den Match vor';
                showCutscene('Aufwärmen', 'Du wärmst dich auf dem Platz auf.\n\nDie Spannung steigt! ⚡');
            } else if (gameState.phase === 'warmup') {
                gameState.phase = 'match';
                document.getElementById('phaseText').textContent = 'Match - Spielzeit';
                document.getElementById('editorSection').style.display = 'none';
                document.getElementById('matchHUD').classList.add('active');
                document.getElementById('actionIndicator').classList.add('active');
                gameState.isPlaying = true;
                gameState.matchTime = 0;
                showCutscene('ANPFIFF', 'Das Spiel beginnt!\n\nSTEUERE MERT KÖMÜR:\nWASD = Bewegen | SPACE = Schuss | E = Pass');
            }
        }

        function updateGameLoop() {
            if (gameState.phase === 'match' && gameState.isPlaying) {
                gameState.matchTime += 1 / 60;
                if (gameState.matchTime >= gameState.matchDuration) {
                    endMatch();
                } else {
                    const minutes = String(Math.floor(gameState.matchTime)).padStart(2, '0');
                    const seconds = String(Math.floor((gameState.matchTime % 1) * 60)).padStart(2, '0');
                    document.getElementById('matchTime').textContent = `${minutes}:${seconds} / ${gameState.matchDuration}:00`;
                    document.getElementById('scoreboard').textContent = `FCA ${gameState.goals} : ${Math.floor(Math.random() * 2)} OPP`;
                }
            }
        }

        function shootBall() {
            gameState.goals += 1;
            setPlayerPose('celebration');
        }

        function passBall() {
            gameState.assists += 1;
            setPlayerPose('pass');
        }

        function endMatch() {
            gameState.isPlaying = false;
            showCutscene('Nach dem Spiel', `FCA ${gameState.goals} : ${Math.floor(Math.random() * 2)}\n\nDeine Performance:\n⚽ Tore: ${gameState.goals}\n🤝 Assists: ${gameState.assists}`);
        }

        function showCutscene(title, text) {
            document.getElementById('cutsceneTitle').textContent = title;
            document.getElementById('cutsceneText').textContent = text;
            document.getElementById('cutscene').classList.add('active');
        }

        function skipCutscene() {
            document.getElementById('cutscene').classList.remove('active');
        }

        // Start game
        initScene();
    </script>
</body>
</html>
